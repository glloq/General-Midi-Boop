name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  # Ratchet for the fail-closed WebSocket payload validation (audit F-19,
  # wave 1 / R3). Fails when schema coverage drops, when either exemption list
  # in src/api/commands/schemas/validation-policy.js grows, when a schema file
  # stops being imported by JsonValidator (it would then validate nothing), or
  # when a newly registered command is left with neither a schema nor an
  # exemption — that command would be refused at runtime. Needs no native
  # module: the registry loads with stub dependencies.
  schema-coverage:
    name: WS schema coverage ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: node scripts/audit/command-inventory.mjs --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=critical

  # Reproduces audit constats B1 (vitest absent) and B2 (eslint config drift)
  # in a clean environment without native build deps (libasound2-dev). If this
  # job goes red, the frontend toolchain has regressed independently of the
  # native MIDI build chain.
  frontend-smoke:
    name: Frontend smoke (no native deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install without native build scripts
        run: npm ci --ignore-scripts
      - name: Lint (B2 reproducer)
        run: npm run lint
      - name: Frontend tests (B1 reproducer)
        run: npm run test:frontend

  test:
    name: Test (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install system dependencies for native builds
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libasound2-dev
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Run frontend tests
        run: npm run test:frontend
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
