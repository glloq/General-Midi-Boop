name: Format preview

on:
  pull_request:
    paths:
      - 'src/midi/instrument/MidiMessageCapabilities.js'
      - 'tests/midi-message-capabilities.test.js'
      - '.github/workflows/format-preview.yml'

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print exact Prettier diff
        run: |
          npx prettier --write src/midi/instrument/MidiMessageCapabilities.js tests/midi-message-capabilities.test.js
          git diff -- src/midi/instrument/MidiMessageCapabilities.js tests/midi-message-capabilities.test.js
